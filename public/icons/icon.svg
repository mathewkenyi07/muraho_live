<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="rwanda-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#20D1FA" />
    </linearGradient>
    <linearGradient id="rwanda-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAD201" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>
    <linearGradient id="rwanda-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20603D" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Outer Ambient Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 12" opacity="0.6"/>

  <!-- Rwanda Tri-Color Concentric Arcs -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#rwanda-blue)" stroke-width="10" stroke-linecap="round" opacity="0.9" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="url(#rwanda-yellow)" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#rwanda-green)" stroke-width="8" stroke-linecap="round" opacity="0.9" />

  <!-- Central Acoustic / Voice Wave Capsule -->
  <circle cx="256" cy="256" r="115" fill="#1E293B" stroke="#00A3E0" stroke-width="3" />

  <!-- Soundwave Bars representing 'Muraho' Greeting -->
  <rect x="176" y="226" width="16" height="60" rx="8" fill="#00A3E0" />
  <rect x="208" y="196" width="16" height="120" rx="8" fill="#20D1FA" />
  <rect x="240" y="166" width="16" height="180" rx="8" fill="#FAD201" />
  <rect x="272" y="186" width="16" height="140" rx="8" fill="#FAD201" />
  <rect x="304" y="211" width="16" height="90" rx="8" fill="#10B981" />
  <rect x="336" y="236" width="16" height="40" rx="8" fill="#10B981" />

  <!-- Radio wave pulses on top -->
  <path d="M 236 120 Q 256 100 276 120" fill="none" stroke="#FAD201" stroke-width="5" stroke-linecap="round" />
  <path d="M 216 100 Q 256 75 296 100" fill="none" stroke="#20D1FA" stroke-width="5" stroke-linecap="round" opacity="0.8" />
</svg>
